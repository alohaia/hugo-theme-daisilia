<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>罗丝薇瑟 · 互动立绘</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    body {
      font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #view {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body:not(.no-ui) #view { height: calc(100% - 36px); }
    #player {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      transform-origin: top left;
      cursor: pointer;
    }
    #player .spine-player, #player canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    #player canvas { touch-action: manipulation; }

    .skins {
      position: fixed;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      display: flex;
      gap: 2px;
      padding: 3px;
      border-radius: 999px;
      background: rgba(18, 10, 34, .42);
      box-shadow: 0 2px 12px rgba(0, 0, 0, .12);
      backdrop-filter: blur(6px);
      opacity: .45;
      transition: opacity .2s;
      z-index: 10;
      user-select: none;
    }
    .skins:hover, .skins:focus-within { opacity: .95; }
    .skins button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 4px 10px;
      background: transparent;
      color: #f4ecff;
      font: inherit;
      font-size: 11px;
      line-height: 1.4;
      letter-spacing: .03em;
      cursor: pointer;
    }
    .skins button.active { background: rgba(155, 112, 210, .55); }
    .skins button:focus-visible { outline: 1px solid rgba(255, 255, 255, .8); }
    .no-ui .skins { display: none; }

    .file-warning {
      position: fixed;
      left: 50%;
      top: 50%;
      width: min(420px, calc(100% - 32px));
      transform: translate(-50%, -50%);
      padding: 18px 20px;
      border: 1px solid rgba(120, 90, 160, .25);
      border-radius: 12px;
      background: rgba(255, 255, 255, .92);
      color: #49395c;
      font-size: 13px;
      line-height: 1.8;
      text-align: center;
      box-shadow: 0 10px 30px rgba(40, 20, 70, .12);
    }
    .file-warning b { color: #7a4fb0; }
  </style>
</head>
<body>
  <div id="view">
    <div id="player" aria-label="罗丝薇瑟互动立绘"></div>
  </div>

  <div class="skins" id="skins">
    <button data-skin="1" class="active">皮肤 1</button>
    <button data-skin="2">皮肤 2</button>
  </div>

  <script src="vendor/spine-player-3.8.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var currentSkin = params.get('skin') === '2' ? '2' : '1';
      var currentAnim = 'idle';
      var player = null;
      var returnTimer = 0;
      var host = document.getElementById('player');

      // SpinePlayer sizes its canvas to the container's CSS pixels. Render at
      // 2x-3x and scale the container back down so edges stay smooth on both
      // normal and HiDPI screens.
      function applySuperSampling() {
        var dpr = window.devicePixelRatio || 1;
        var ss = Math.min(3, Math.max(2, Math.ceil(dpr)));
        host.style.width = (ss * 100) + '%';
        host.style.height = (ss * 100) + '%';
        host.style.transform = 'scale(' + (1 / ss) + ')';
      }
      applySuperSampling();
      addEventListener('resize', applySuperSampling);

      // file:// cannot XHR local model files. Blogs are served over http(s),
      // so this only affects double-clicking the HTML from disk.
      if (location.protocol === 'file:') {
        document.body.innerHTML =
          '<div class="file-warning">' +
          '本地直接双击 <b>embed.html</b> 时，浏览器会禁止读取模型文件。<br>' +
          '请双击同目录的 <b>start.bat</b>，或把整个目录部署到博客的 http(s) 地址后再访问。' +
          '</div>';
        return;
      }

      if (params.get('ui') === '0') document.body.classList.add('no-ui');

      var MODELS = {
        '1': { json: 'assets/30134.json', atlas: 'assets/30134.atlas' },
        '2': { json: 'assets/30134_02.json', atlas: 'assets/30134_02.atlas' }
      };

      function setActiveSkin() {
        document.querySelectorAll('[data-skin]').forEach(function (b) {
          b.classList.toggle('active', b.getAttribute('data-skin') === currentSkin);
        });
      }

      function play(name) {
        if (!player) return;
        clearTimeout(returnTimer);
        currentAnim = name;
        player.setAnimation(name, name === 'idle');

        if (name === 'touch') {
          var current = player.animationState && player.animationState.getCurrent(0);
          var duration = current && current.animation ? current.animation.duration : 11.5;
          returnTimer = setTimeout(function () {
            if (currentAnim === 'touch') play('idle');
          }, duration * 1000 + 80);
        }
      }

      function clearPlayer() {
        if (player) {
          var old = player;
          try { old.stopRendering(); } catch (e) {}
          // Let the current frame finish before deleting its textures.
          setTimeout(function () {
            try { old.assetManager.dispose(); } catch (e) {}
          }, 300);
          player = null;
        }
        host.innerHTML = '';
      }

      function mount(skin) {
        clearPlayer();
        currentSkin = skin;
        setActiveSkin();
        currentAnim = 'idle';

        var model = MODELS[skin];
        var next = new spine_3_8.SpinePlayer('player', {
          jsonUrl: model.json,
          atlasUrl: model.atlas,
          showLoading: false,
          showControls: false,
          animation: 'idle',
          skin: 'normal',
          alpha: true,
          premultipliedAlpha: true,
          backgroundColor: '#00000000',
          viewport: { padLeft: '2%', padRight: '2%', padTop: '1%', padBottom: '2%' },
          success: function (p) {
            if (player !== next) {
              try { p.stopRendering(); } catch (e) {}
              return;
            }
            player = p;
            window.__player = p;
            p.play();
          }
        });
        player = next;
      }

      host.addEventListener('click', function () {
        play('touch');
      });

      document.querySelectorAll('[data-skin]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var skin = btn.getAttribute('data-skin');
          if (skin !== currentSkin) mount(skin);
        });
      });

      mount(currentSkin);
    })();
  </script>
</body>
</html>
