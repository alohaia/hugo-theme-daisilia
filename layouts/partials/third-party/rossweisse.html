<style>
#rossweisse-live {
  position: fixed;
  height: 560px;
  aspect-ratio: 445 / 560;
  bottom:0;
  right:0;
}
#rossweisse-live.focused {
  height: 100vh;
  /* centering */
  bottom: auto;
  right: auto;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
#rossweisse-toggle {
  position: fixed;
  bottom: 8px;
  right: 8px;
  z-index: 10;
  padding: 4px 10px;
  font-size: 13px;
  border: 1px solid #888;
  border-radius: 999px;
  color: #fff;
  background: rgba(18, 10, 34, 0.42);
  opacity: 0.7;
  cursor: pointer;
  touch-action: manipulation;
}
#rossweisse-toggle:hover {
  opacity: 0.95;
}
#rossweisse-toggle[aria-pressed="true"] {
  background: rgba(155, 112, 210, 0.8);
  border-color: rgba(155, 112, 210, 0.8);
}
</style>
<div id="rossweisse-live"></div>
<button id="rossweisse-toggle" type="button" aria-pressed="false">聚焦</button>

<script src="/rossweisse/vendor/spine-player-3.8.js"></script>
<script src="/rossweisse/inline.js"></script>
<script>
CZNInline.mount('#rossweisse-live', {
  skin: 1,
  passthrough: true,
  showSkins: true
});
const rs_wrapper = document.getElementById('rossweisse-live');
const rs_toggle = document.getElementById('rossweisse-toggle');

rs_toggle.addEventListener('click', () => {
  const focused = rs_wrapper.classList.toggle('focused');
  rs_toggle.setAttribute('aria-pressed', String(focused));
  rs_toggle.textContent = focused ? '还原' : '聚焦';
});
</script>
