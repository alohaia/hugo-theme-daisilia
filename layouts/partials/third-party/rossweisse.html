<style>
#rossweisse-live {
  position: fixed;
  height: 560px;
  aspect-ratio: 445 / 560;
  bottom:0;
  right:0;
}
#rossweisse-live.focused {
  height: 100vh;
  /* centering */
  bottom: auto;
  right: auto;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
#rossweisse-toggle {
  position: fixed;
  bottom: 8px;
  right: 8px;
  z-index: 10;
  padding: 4px 10px;
  font-size: 13px;
  border: 1px solid #888;
  border-radius: 999px;
  color: #fff;
  background: rgba(18, 10, 34, 0.42);
  opacity: 0.7;
  cursor: pointer;
  touch-action: manipulation;
}
#rossweisse-toggle:hover {
  opacity: 0.95;
}
#rossweisse-toggle[aria-pressed="true"] {
  background: rgba(155, 112, 210, 0.8);
  border-color: rgba(155, 112, 210, 0.8);
}
</style>
<script>
(function () {
  var LOADED = '__rossweisseBooted';
  if (window[LOADED]) return;
  window[LOADED] = true;

  var STORAGE_KEY = 'rossweisse-live-enabled';
  var memoryFlag = null;
  var api = null;
  var host = null;
  var toggle = null;
  var loading = false;

  function queryFlag() {
    try {
      return (new URLSearchParams(window.location.search).get('rossweisse') || '').toLowerCase();
    } catch (e) {
      var m = window.location.search.match(/[?&]rossweisse=([^&]*)/i);
      return m ? decodeURIComponent(m[1]).toLowerCase() : '';
    }
  }

  function storageGet() {
    try {
      return window.sessionStorage.getItem(STORAGE_KEY) === 'true';
    } catch (e) {
      return false;
    }
  }

  function storageSet(on) {
    memoryFlag = !!on;
    try {
      if (on) window.sessionStorage.setItem(STORAGE_KEY, 'true');
      else window.sessionStorage.removeItem(STORAGE_KEY);
    } catch (e) {}
  }

  function enabled() {
    return memoryFlag === null ? storageGet() : memoryFlag;
  }

  function createUI() {
    if (host) return;
    host = document.createElement('div');
    host.id = 'rossweisse-live';
    toggle = document.createElement('button');
    toggle.id = 'rossweisse-toggle';
    toggle.type = 'button';
    toggle.setAttribute('aria-pressed', 'false');
    toggle.textContent = '聚焦';
    document.body.appendChild(host);
    document.body.appendChild(toggle);

    toggle.addEventListener('click', function () {
      var focused = host.classList.toggle('focused');
      toggle.setAttribute('aria-pressed', String(focused));
      toggle.textContent = focused ? '还原' : '聚焦';
    });
  }

  function mount() {
    if (api || !window.CZNInline) return;
    createUI();
    try {
      api = window.CZNInline.mount('#rossweisse-live', {
        skin: 1,
        passthrough: true,
        showSkins: true
      });
      window.__rossweisseApi = api;
    } catch (e) {
      console.error('[rossweisse] mount failed', e);
      teardown();
    }
  }

  function loadScript(src, next) {
    var s = document.createElement('script');
    s.src = src;
    s.async = false;
    s.onload = next;
    s.onerror = function () {
      console.error('[rossweisse] failed to load ' + src);
      loading = false;
      teardown();
    };
    document.head.appendChild(s);
  }

  function boot() {
    if (!enabled() || api || loading) return;
    if (window.CZNInline) {
      mount();
      return;
    }
    loading = true;
    loadScript('/rossweisse/vendor/spine-player-3.8.js', function () {
      loadScript('/rossweisse/inline.js', function () {
        loading = false;
        if (enabled()) mount();
      });
    });
  }

  function teardown() {
    if (api) {
      try { api.destroy(); } catch (e) {}
      api = null;
      window.__rossweisseApi = null;
    }
    if (host && host.parentNode) host.parentNode.removeChild(host);
    if (toggle && toggle.parentNode) toggle.parentNode.removeChild(toggle);
    host = null;
    toggle = null;
  }

  var flag = queryFlag();
  if (flag === 'true') storageSet(true);
  else if (flag === 'false') storageSet(false);

  if (enabled()) boot();
})();
</script>
